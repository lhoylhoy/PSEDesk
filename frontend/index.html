<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f6fb" />
    <meta
      name="description"
      content="PSE Signal Desk - a personal Philippine equity research notebook: model-screened PSE candidates, day-over-day drift and drop explanations, and paper-portfolio tracking. Research tooling only, not investment advice."
    />
    <!--
      The typeface is bundled, not linked from a font CDN (see the @font-face block in
      src/index.css and PRIVACY.md §5). Preloading the latin subset — the one that carries
      almost every character on screen — lets the first paint use it instead of the swap
      fallback; `crossorigin` is required on a font preload even same-origin.
    -->
    <link
      rel="preload"
      href="/fonts/google-sans-flex-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      The tab icon, the iOS home-screen icon and the header badge are one drawing (see
      src/lib/deskMarkGeometry.ts, generated into public/ by `npm run icons`). The .ico stays
      because Safari before 26 and iOS Safari ignore SVG favicons; browsers that support SVG pick it.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="application-name" content="PSE Signal Desk" />
    <meta name="apple-mobile-web-app-title" content="PSE Desk" />
    <title>PSE Signal Desk · Personal PSE Research Notebook</title>
    <script>
      // Paint the stored theme before the first frame so a light-mode reader never sees a
      // dark flash. Kept inline (and dependency-free) because it must run before the bundle.
      (function () {
        try {
          var theme = window.localStorage.getItem('psedesk.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);

          // Keep the browser chrome (iOS status bar, Android address bar) on the same
          // colour as the terminal. Updated again by `applyTheme` when the user flips it.
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#05080d' : '#f3f6fb');
          }

          var mode = window.localStorage.getItem('psedesk.viewMode');
          document.documentElement.setAttribute('data-view-mode', mode === 'pro' ? 'pro' : 'simple');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.setAttribute('data-view-mode', 'simple');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
